exec-once = wlsunset -l 41.0 -L 28.9 -t 3000 -T 6500 # night light

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(6A5D7Bff) rgba(9B8AA1ff) 45deg
    resize_on_border = true
    extend_border_grab_area = 10
    layout = master
}

decoration {
    rounding = 10
    active_opacity = 1.4
    inactive_opacity = 1.0
  
    blur {
      ignore_opacity = true
      enabled = true
      size = 2
      passes = 1
      new_optimizations = yes
      xray = true
      vibrancy = 0.1696
    } 

    shadow {
      enabled = true
      range = 4
      render_power = 3
      color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
